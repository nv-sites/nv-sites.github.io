<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>nv-sites — сайты для бизнеса Нижневартовска</title>
<style>
  :root { --bg: #f4f1ea; --ink: #1d1b18; --muted: #6b665d; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--bg); color: var(--ink);
         font: 17px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 34rem; }
  h1 { font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1.05; letter-spacing: -0.02em; margin-bottom: 16px; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Сайты для местного бизнеса</h1>
  <p>Нижневартовск. Одностраничные сайты для мастеров, сервисов и магазинов — быстро, аккуратно, с кнопкой «Позвонить».</p>
</main>
</body>
</html>
